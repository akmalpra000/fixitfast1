<script src="articles.js"></script>
<script>
const today=new Date().toISOString().slice(0,10);
const live=ARTICLES.filter(a=>a.date<=today).sort((a,b)=>b.date.localeCompare(a.date));
let cat="All";const grid=document.getElementById("grid"),q=document.getElementById("q");
function chips(){const cs=["All",...new Set(live.map(a=>a.category))];
 document.getElementById("chips").innerHTML=cs.map(c=>`<button class="chip ${c==cat?"on":""}" data-c="${c}">${c}</button>`).join("");
 document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{cat=b.dataset.c;chips();draw()})}
function draw(){const t=q.value.toLowerCase();
 const l=live.filter(a=>(cat=="All"||a.category==cat)&&(a.title+a.summary).toLowerCase().includes(t));
 grid.innerHTML=l.length?l.map(a=>`<a class="card" href="article.html?id=${a.id}"><span class="meta">${a.category} · ${a.date}</span><h3>${a.title}</h3><p>${a.summary}</p></a>`).join(""):"<p>No guides found yet. Check back tomorrow.</p>"}
q.oninput=draw;chips();draw();document.getElementById("y").textContent=new Date().getFullYear();
</script></body></html>
